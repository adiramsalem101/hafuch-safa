; הגדרות "הפוך שפה" (hafuch-safa) ל-macOS
; אחרי שינוי: לחיצה על אA בשורת התפריטים, ואז "טען מחדש".
; שורה שמתחילה ב-; היא הערה ואין לה השפעה.
; שמות המפתחות זהים לגרסת ה-Windows.

[General]

; שילוב המקשים שהופך את הטקסט.
; אפשר לכתוב: Ctrl+Option+L, Ctrl+Shift+K, Cmd+Option+H, Ctrl+Option+F9
; Alt הוא שם נוסף ל-Option, ו-Win הוא שם נוסף ל-Cmd, כמו בקובץ של Windows.
; חובה לפחות מקש צירוף אחד (Ctrl, Option, Shift או Cmd).
Hotkey=Ctrl+Option+L

; איזו פריסה עברית נמצאת בשימוש:
;   auto    לפי מקור הקלט העברי שמוגדר במק (מומלץ)
;   mac     מקור הקלט Hebrew (ברירת המחדל של macOS)
;   pc      מקור הקלט Hebrew-PC (כמו ב-Windows). גם standard מתקבל
;   qwerty  מקור הקלט Hebrew-QWERTY (פונטי)
HebrewLayout=auto

; להחליף את מקור הקלט של המערכת לשפת היעד אחרי ההיפוך: 1 = כן, 0 = לא
SwitchLayout=1

; כמה זמן (באלפיות שנייה) לחיצה נוספת מרחיבה את ההיפוך למילה אחת אחורה
ExpandWindowMs=2000

; איך להכניס את הטקסט המתוקן:
;   type   הקלדה של התווים (מומלץ, נמדד כאמין יותר, ראו ASSUMPTIONS.md)
;   paste  דרך הלוח (Cmd+V), והתוכן המקורי של הלוח חוזר למקומו אחר כך.
; טקסט עם ירידת שורה מודבק תמיד, כי Enter שולח הודעה באפליקציות צ'אט.
; קריאת טקסט מסומן נעשית תמיד דרך הלוח, והלוח המקורי משוחזר בסוף.
InsertMethod=type

; אותו דבר בטרמינלים (Terminal, iTerm2, Warp, Ghostty ודומיהם)
TerminalInsertMethod=type

; להציג הודעה קטנה כשאין מה להפוך: 1 = כן, 0 = לא
ShowTips=1

; להציג את הסמל אA בשורת התפריטים: 1 = כן, 0 = לא
ShowMenuBarIcon=1

; אפליקציות שבהן הקיצור לא יופעל ויגיע כרגיל לאפליקציה עצמה, מופרדות בפסיק.
; אפשר לכתוב שם של אפליקציה או מזהה (bundle ID). כוכבית בסוף מתאימה לכל מה שמתחיל כך.
; לדוגמה: ExcludeApps=Microsoft Word,com.jetbrains.*
ExcludeApps=

; ---- הגדרות מתקדמות. בלי שורה פעילה, ברירת המחדל שבסוגריים ----
; במצב paste: כמה זמן (באלפיות שנייה) לחכות אחרי Cmd+V לפני שחזור הלוח (300)
; PasteRestoreDelayMs=300
; יומן אבחון בקובץ debug.log ליד קובץ ההגדרות. נרשמים רק אורכים ותוצאות, לעולם לא הטקסט (0)
; DebugLog=0
; רשימת הטרמינלים, ורשימת עורכי הקוד שמעתיקים שורה שלמה כשאין סימון
; (הרשימות המלאות מופיעות בקובץ core.lua):
; TerminalApps=com.apple.Terminal,com.googlecode.iterm2
; LineCopyApps=com.microsoft.VSCode,com.jetbrains.*
