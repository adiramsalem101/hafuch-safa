; הגדרות "הפוך שפה" (hafuch-safa)
; אחרי שינוי: קליק ימני על האייקון של הכלי ליד השעון, ואז "טען מחדש".
; שורה שמתחילה ב-; היא הערה ואין לה השפעה.

[General]

; שילוב המקשים שהופך את הטקסט.
; אפשר לכתוב בצורה חופשית: Ctrl+Alt+L, Ctrl+Shift+K, Win+Alt+H, Ctrl+Alt+F9
; או בתחביר של AutoHotkey: ^!l  (^ = Ctrl, ! = Alt, + = Shift, # = Win)
; חובה לפחות מקש צירוף אחד (Ctrl, Alt, Shift או Win).
Hotkey=Ctrl+Alt+L

; איזו פריסה עברית נמצאת בשימוש:
;   auto      קריאה ישירה של הפריסות שמותקנות ב-Windows (מומלץ)
;   standard  הפריסה Hebrew או Hebrew (Standard) של Windows
;   mac       הפריסה Hebrew של macOS (האותיות והסימנים שסביבן)
HebrewLayout=auto

; להחליף את פריסת המקלדת של המערכת לשפת היעד אחרי ההיפוך: 1 = כן, 0 = לא
SwitchLayout=1

; כמה זמן (באלפיות שנייה) לחיצה נוספת מרחיבה את ההיפוך למילה אחת אחורה
ExpandWindowMs=2000

; איך להכניס את הטקסט המתוקן:
;   paste  דרך הלוח (Ctrl+V), והתוכן המקורי של הלוח חוזר למקומו מיד אחר כך
;   type   הקלדה ישירה של התווים
InsertMethod=paste

; בטרמינלים (cmd, PowerShell, Windows Terminal ודומיהם)
TerminalInsertMethod=type

; להציג הודעה קטנה כשאין מה להפוך: 1 = כן, 0 = לא
ShowTips=1

; תוכנות שבהן הקיצור לא יופעל ויגיע כרגיל לתוכנה עצמה, מופרדות בפסיק.
; לדוגמה, ב-IntelliJ וב-PyCharm הקיצור Ctrl+Alt+L מסדר קוד:
; ExcludeApps=idea64.exe,pycharm64.exe
ExcludeApps=

; ---- הגדרות מתקדמות. בלי שורה פעילה, ברירת המחדל שבסוגריים ----
; זמן המתנה מקסימלי לתוכנה שתדביק מהלוח, ואחריו מקלידים במקום (2000)
; PasteTimeoutMs=2000
; המתנה כשתוכנה אחרת קראה את הלוח לפני ההדבקה (400)
; PasteFallbackDelayMs=400
; רשימת הטרמינלים, ורשימת עורכי הקוד שמעתיקים שורה שלמה כשאין סימון
; (הרשימות המלאות מופיעות בקובץ lib\core.ahk):
; TerminalApps=WindowsTerminal.exe,cmd.exe,powershell.exe
; LineCopyApps=Code.exe,idea64.exe
